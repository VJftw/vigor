name: PR

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # The DOM packages' files are for the browser only (a DOM file without its
      # build tag fails here), so every platform builds the packages, which are
      # empty natively: build systems that build for all of them (Bazel's //...)
      # work without special cases.
      - name: Build and vet (native)
        run: go build ./... && go vet ./...

      - name: Build (WebAssembly)
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./... && go vet ./...

  core:
    name: Core tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The reactive core, the router's matching, and the site tooling need no
      # browser.
      - name: Go test
        run: go test -race -cover . ./router ./site ./cmd/vigor

  browser:
    name: Package tests (browser)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Chrome's sandbox needs user namespaces, which Ubuntu 24.04 restricts.
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Runs WebAssembly tests in the Chrome the runner has.
      - name: Install wasmbrowsertest
        run: go install github.com/agnivade/wasmbrowsertest@latest

      - name: Go test
        env:
          GOOS: js
          GOARCH: wasm
        # One package at a time: each starts its own Chrome, which can miss its
        # start-up deadline when they compete for a small runner.
        #
        # Chrome sometimes misses its start-up deadline on a shared runner
        # ("websocket url timeout reached"), so a failure is tried again; a
        # test that really fails does so every time.
        run: |
          for attempt in 1 2 3; do
            go test -p 1 -exec "$(go env GOPATH)/bin/wasmbrowsertest" ./html/... ./web/... && exit 0
            echo "::warning::attempt $attempt failed"
          done
          exit 1

  features:
    name: Examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Each example is built to WebAssembly and driven in Chrome.
      - name: Go test
        working-directory: examples/features
        # Each example builds a WebAssembly program and starts Chrome: a few at a
        # time, so the runner is not starved.
        # A failure is tried again, for Chrome's start-up (see above); passing
        # packages are cached, so only the failed ones run again.
        run: |
          for attempt in 1 2 3; do
            go test -p 2 ./... && exit 0
            echo "::warning::attempt $attempt failed"
          done
          exit 1
